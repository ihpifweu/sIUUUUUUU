<!DOCTYPE html>
<html lang="ar" dir="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Studio - ميني ريبليت الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand">
            <div class="status-dot"></div>
            <span>Nexus Studio (Replit Mode)</span>
        </div>
        <div class="user-badge" onclick="toggleAuthModal()">👤 علاوي (حسابي)</div>
    </header>

    <div id="chat-container">
        <div class="message ai">هلا بيك يا علاوي! النظام مرتب وجاهز. اطلب أي موقع أو فكرة برمجية وسأقوم بتوليدها وتنسيقها لك بالكامل. / Welcome Ali! Ready to build apps and code.</div>
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="اطلب موقعاً أو كوداً برمجياً هنا... / Request website or code..." rows="1" onkeypress="handleKeyPress(event)"></textarea>
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
